name: FinSight CI

on:
  push:
    branches: ["main", "frontend/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app/app.py streamlit_app.py src/rule_engine.py src/ai.py src/persistence.py

      - name: Run tests
        run: python -m pytest -q

      - name: Streamlit boot smoke test
        shell: bash
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/finsight-streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8501/_stcore/health"
          last = None

          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      body = response.read().decode("utf-8", "ignore")
                      if response.status == 200 and "ok" in body.lower():
                          print("Streamlit health check passed.")
                          raise SystemExit(0)
                      last = f"Unexpected response: {response.status} {body[:200]}"
              except Exception as exc:
                  last = repr(exc)
              time.sleep(1)

          print("Streamlit did not become healthy.")
          print("Last error:", last)
          print(open("/tmp/finsight-streamlit.log", encoding="utf-8", errors="ignore").read())
          raise SystemExit(1)
          PY
